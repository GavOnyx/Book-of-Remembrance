# Note: org.gradle.jvmargs is intentionally omitted. The build runs with
# org.gradle.daemon=false (in-process), so heap is controlled via GRADLE_OPTS.
# daemon=false is duplicated here (in addition to the user-home properties)
# because the wrapper launcher was not reliably picking up the user-home file.
org.gradle.daemon=false
# The Kotlin compile daemon cannot connect on this host (localhost socket
# filter), so compile in-process instead of failing after 4 retries.
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
